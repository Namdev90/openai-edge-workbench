name: Workbench tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Application regression tests
        working-directory: source
        run: python -m unittest discover -s tests -v
      - name: Verify embedded payload against readable source
        run: python tools/verify_payload.py
      - name: Verify archived migration source
        run: python tools/verify_migration.py
      - name: Verify documented feature catalog
        run: python tools/feature_catalog.py --check
      - name: Verify documentation and preview assets
        run: python tools/verify_docs.py
      - name: Windows setup and parser tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/Test-Setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh.exe -NoProfile -File tools/Test-Setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows CMD extraction and offline bootstrap smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:EDGE_ROOT=Join-Path $env:RUNNER_TEMP 'workbench-launcher-smoke'
          $env:EDGE_NO_LAUNCH='1'
          & ./OpenAI-Edge-Workbench.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./OpenAI-Edge-Workbench-Setup.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
