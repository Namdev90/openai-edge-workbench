name: Workbench tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Application regression tests
        working-directory: source
        run: python -m unittest discover -s tests -v
      - name: Verify embedded payload against readable source
        run: python tools/verify_payload.py
